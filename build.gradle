buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
//      mavenLocal()
        mavenCentral()
        maven {url "https://s01.oss.sonatype.org/content/groups/public"}
        maven {url "https://s01.oss.sonatype.org/content/repositories/releases"}
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    minSdkVersion = 16                    // 保持原有最低版本
    compileSdkVersion = 33                // 保守升级到 Android 13
    targetSdkVersion = 33                 // 保守升级到 Android 13
    buildToolsVersion = '33.0.0'          // 升级构建工具
    javaVersion = JavaVersion.VERSION_11  // 升级 Java 版本  
    ndkVersion = "27.0.12077973"          // 升级到支持 16KB 页面的 NDK 版本
    cmakeVersion = "3.18.1"               // 恢复原来的 CMake 版本
    abiFilters = "armeabi-v7a,arm64-v8a,x86,x86_64"
    useASAN = false

    POM_GROUP_ID = "com.iqiyi.xcrash"
    POM_ARTIFACT_ID = "xcrash-android-lib"
    POM_VERSION_NAME = "3.1.0"

    POM_NAME = "xCrash Android Lib"
    POM_DESCRIPTION = "xCrash provides the Android app with the ability to capture java crash, native crash and ANR."
    POM_URL = "https://github.com/iqiyi/xCrash"
    POM_INCEPTION_YEAR = "2020"
    POM_PACKAGING = "aar"

    POM_SCM_CONNECTION = "https://github.com/iqiyi/xCrash.git"

    POM_ISSUE_SYSTEM = "github"
    POM_ISSUE_URL = "https://github.com/iqiyi/xCrash/issues"

    POM_LICENCE_NAME = "The MIT License"
    POM_LICENCE_URL = "https://opensource.org/licenses/MIT"
    POM_LICENCE_DIST = "repo"

    POM_DEVELOPER_ID = "iQIYI"
    POM_DEVELOPER_NAME = "iQIYI, Inc."
}
